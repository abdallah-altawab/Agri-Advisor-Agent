[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-advisor-agent"
version = "0.1.0"
description = "Agentic tomato-disease advisor: image diagnosis, weather-aware re-ranking and RAG-grounded recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]