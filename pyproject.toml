[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-advisor-agent"
version = "0.1.0"
description = "Agentic tomato-disease advisor: image diagnosis, weather-aware re-ranking and RAG-grounded recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "numpy>=2.4.6",
    "pydantic-settings>=2.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
